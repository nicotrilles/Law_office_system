{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jumamil Law System{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{% url 'home' %}">Jumamil Law System</a>
      <nav aria-label="Main">
        {# Navigation links are added as each module is built. #}
      </nav>
    </div>
  </header>

  <main class="container">
    {% if messages %}
      <ul class="messages" role="status">
        {% for message in messages %}
          <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Internal use only</div>
  </footer>
</body>
</html>
